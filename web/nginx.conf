server {
    listen 18788;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    autoindex on;
    autoindex_exact_size off;
    autoindex_localtime on;

    # Block direct download of the submissions log.
    location = /data/apikey-requests.jsonl { return 404; }

    # API key submission endpoint -> local Python server.
    location /api/ {
        proxy_pass http://127.0.0.1:28789;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 15s;
        client_max_body_size 32k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/html;

    add_header Cache-Control "no-cache, must-revalidate";
}
