<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>登录 · 华为服务器</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a1f2a;
      --border: #2a3142;
      --text: #e6e6e6;
      --muted: #8b95a8;
      --accent: #4a9eff;
      --accent-soft: #1e3a5f;
      --danger: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
    }
    .login-box {
      width: 100%; max-width: 400px;
      padding: 40px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    h1 { font-size: 22px; font-weight: 600; margin-bottom: 8px; text-align: center; }
    .subtitle { color: var(--muted); font-size: 13px; text-align: center; margin-bottom: 32px; }
    .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 18px; }
    .field label { font-size: 13px; font-weight: 500; color: var(--muted); }
    input[type=text], input[type=password] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus { border-color: var(--accent); }
    button.submit {
      width: 100%;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: opacity 0.15s;
    }
    button.submit:hover { opacity: 0.9; }
    button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert {
      padding: 10px 14px;
      border-radius: 6px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .alert.show { display: block; }
    .alert.error { background: rgba(255,107,107,0.1); border: 1px solid var(--danger); color: var(--danger); }
    .back-link { display: block; text-align: center; margin-top: 24px; color: var(--muted); text-decoration: none; font-size: 13px; }
    .back-link:hover { color: var(--text); }
    .register-link { display: block; text-align: center; margin-top: 12px; color: var(--accent); text-decoration: none; font-size: 14px; }
    .register-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="login-box">
    <h1>用户登录</h1>
    <p class="subtitle">华为服务器资源管理平台</p>

    <div class="alert" id="alert"></div>

    <form id="login-form">
      <div class="field">
        <label for="username">用户名</label>
        <input type="text" id="username" name="username" required autocomplete="username" autofocus>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>
      <button type="submit" class="submit" id="submit-btn">登 录</button>
    </form>

    <a href="register.html" class="register-link">没有账号？注册</a>
    <a href="./" class="back-link">← 返回首页</a>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submit-btn');

    // Redirect if already logged in
    (async () => {
      try {
        const r = await fetch('/api/auth/check');
        if (r.ok) { window.location.replace('/profile.html'); }
      } catch (e) { /* not logged in, stay */ }
    })();

    function showAlert(msg) {
      alertEl.className = 'alert show error';
      alertEl.textContent = msg;
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'alert';
      btn.disabled = true;
      btn.textContent = '登录中…';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          window.location.replace('/profile.html');
        } else {
          showAlert(data.error || '登录失败');
        }
      } catch (err) {
        showAlert('网络错误：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '登 录';
      }
    });
  </script>
</body>
</html>
