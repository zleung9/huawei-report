services:
  reports-web:
    image: huawei-reports-web:latest
    container_name: huawei-reports-web
    restart: unless-stopped
    network_mode: host
    environment:
      - HPC_PASSWORD=${HPC_PASSWORD:?HPC_PASSWORD must be set in .env}
    volumes:
      - /home/liangzhu/huawei-db:/opt/db-data
      - /home/liangzhu/huawei-reports/data:/usr/share/nginx/html/data
