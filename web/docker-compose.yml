# ⚠️  SECURITY NOTE: HPC_PASSWORD stores a personal user password in plaintext
#     (visible via `docker inspect`). The credential belongs to a specific user
#     on the HPC head node. TODO: Replace with SSH key-based auth — mount the
#     key read-only and remove HPC_PASSWORD entirely.
#
# Copy .env.example to .env and fill in HPC_PASSWORD before running:
#   docker compose up -d

services:
  reports-web:
    image: huawei-reports-web:latest
    container_name: huawei-reports-web
    restart: unless-stopped
    network_mode: host
    environment:
      - HPC_PASSWORD=${HPC_PASSWORD:?HPC_PASSWORD must be set in .env}
      - LLM_API_AUTH=${LLM_API_AUTH:?LLM_API_AUTH must be set in .env}
    volumes:
      - /home/liangzhu/huawei-db:/opt/db-data
      - /home/liangzhu/huawei-reports/data:/usr/share/nginx/html/data
