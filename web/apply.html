<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>申请 API Key · 嘉庚创新实验室</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a1f2a;
      --border: #2a3142;
      --text: #e6e6e6;
      --muted: #8b95a8;
      --accent: #4a9eff;
      --accent-soft: #1e3a5f;
      --danger: #ff6b6b;
      --success: #51cf66;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 48px 24px; }
    header { border-bottom: 1px solid var(--border); padding-bottom: 24px; margin-bottom: 32px; }
    h1 { font-size: 26px; font-weight: 600; margin-bottom: 8px; }
    .subtitle { color: var(--muted); font-size: 14px; }
    .back-link { display: inline-block; margin-bottom: 16px; color: var(--accent); text-decoration: none; font-size: 14px; }
    .back-link:hover { text-decoration: underline; }
    form { display: flex; flex-direction: column; gap: 22px; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label.title { font-size: 14px; font-weight: 500; color: var(--text); }
    .field label.title .required { color: var(--danger); margin-left: 2px; }
    .field .hint { color: var(--muted); font-size: 12px; }
    input[type=text], input[type=email], select, textarea {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 10px 12px;
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea { min-height: 80px; resize: vertical; }
    .radio-group, .checkbox-group {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 8px 16px;
    }
    .radio-group label, .checkbox-group label {
      display: flex; align-items: flex-start; gap: 8px;
      padding: 8px 10px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1.4;
      transition: border-color 0.15s, background 0.15s;
    }
    .radio-group label:hover, .checkbox-group label:hover { border-color: var(--accent); }
    .radio-group input, .checkbox-group input { margin-top: 3px; accent-color: var(--accent); }
    .checkbox-group label .meta { color: var(--muted); font-size: 12px; display: block; margin-top: 2px; }
    button.submit {
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 6px;
      padding: 12px 24px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      align-self: flex-start;
      transition: opacity 0.15s;
    }
    button.submit:hover { opacity: 0.9; }
    button.submit:disabled { opacity: 0.5; cursor: not-allowed; }
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      display: none;
    }
    .alert.show { display: block; }
    .alert.error { background: rgba(255,107,107,0.1); border: 1px solid var(--danger); color: var(--danger); }
    .alert.success { background: rgba(81,207,102,0.1); border: 1px solid var(--success); color: var(--success); }
    footer { margin-top: 64px; padding-top: 24px; border-top: 1px solid var(--border); color: var(--muted); font-size: 12px; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <a href="./" class="back-link">← 返回控制台</a>
    <header>
      <h1>申请 API Key</h1>
      <p class="subtitle">嘉庚创新实验室 · 大模型服务申请。提交后管理员会审核并通过邮件下发 key。</p>
    </header>

    <div class="alert" id="alert"></div>

    <form id="apply-form">
      <div class="field">
        <label class="title" for="name">姓名 <span class="required">*</span></label>
        <input type="text" id="name" name="name" required maxlength="100" autocomplete="name">
      </div>

      <div class="field">
        <label class="title" for="email">邮箱 <span class="required">*</span></label>
        <input type="email" id="email" name="email" required maxlength="200" autocomplete="email">
        <span class="hint">用于接收 API Key 和后续通知</span>
      </div>

      <div class="field">
        <label class="title">身份 <span class="required">*</span></label>
        <div class="radio-group">
          <label><input type="radio" name="affiliation_type" value="internal" required> 校内（厦大/嘉庚）</label>
          <label><input type="radio" name="affiliation_type" value="external" required> 校外（合作单位）</label>
        </div>
      </div>

      <div class="field">
        <label class="title" for="group">研究组 / 单位 <span class="required">*</span></label>
        <input type="text" id="group" name="group" required maxlength="200" placeholder="如：嘉庚创新实验室 XX 团队 / XX 大学 XX 系">
      </div>

      <div class="field">
        <label class="title">用途 <span class="required">*</span>（多选；不同用途对模型和上下文窗口的需求不同）</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="purposes" value="long-doc"> 长文档总结 / 整本书分析<span class="meta">需要 ≥32K 上下文（GLM5.1 128K 优势）</span></label>
          <label><input type="checkbox" name="purposes" value="code"> 代码生成 / 代码库分析<span class="meta">DeepSeek V4 / GLM5.1 编程能力强</span></label>
          <label><input type="checkbox" name="purposes" value="rag"> 学术问答 / 文献综述（RAG）<span class="meta">中等上下文，知识检索类</span></label>
          <label><input type="checkbox" name="purposes" value="writing"> 论文写作 / 翻译润色<span class="meta">中文表达 GLM5.1 / Qwen3.6 较佳</span></label>
          <label><input type="checkbox" name="purposes" value="reasoning"> 数学 / 推理 / 复杂任务<span class="meta">DeepSeek V4 推理能力强</span></label>
          <label><input type="checkbox" name="purposes" value="tutoring"> 多轮对话 / 教学问答<span class="meta">通用对话场景</span></label>
          <label><input type="checkbox" name="purposes" value="throughput"> 大批量短文本处理<span class="meta">吞吐优先，Qwen3.6 性价比高</span></label>
          <label><input type="checkbox" name="purposes" value="other"> 其它<span class="meta">请在备注中说明</span></label>
        </div>
      </div>

      <div class="field">
        <label class="title" for="volume">预计月调用量 <span class="required">*</span></label>
        <select id="volume" name="volume" required>
          <option value="">请选择</option>
          <option value="<10k">少量探索（&lt; 10k tokens / 月）</option>
          <option value="10k-100k">轻度使用（10k – 100k tokens / 月）</option>
          <option value="100k-1M">中度使用（100k – 1M tokens / 月）</option>
          <option value="1M-10M">重度使用（1M – 10M tokens / 月）</option>
          <option value=">10M">大规模（&gt; 10M tokens / 月）</option>
        </select>
      </div>

      <div class="field">
        <label class="title">需要的模型 <span class="required">*</span>（多选）</label>
        <div class="checkbox-group">
          <label><input type="checkbox" name="models" value="glm5.1"> GLM5.1<span class="meta">中文强 / 128K 长上下文</span></label>
          <label><input type="checkbox" name="models" value="deepseek-v4"> DeepSeek V4<span class="meta">推理 / 代码 / 数学</span></label>
          <label><input type="checkbox" name="models" value="qwen3.6"> Qwen3.6<span class="meta">通用 / 高吞吐 / 性价比</span></label>
        </div>
      </div>

      <div class="field">
        <label class="title" for="notes">备注（可选）</label>
        <textarea id="notes" name="notes" maxlength="2000" placeholder="项目背景、特殊需求、上下文窗口要求等"></textarea>
      </div>

      <button type="submit" class="submit" id="submit-btn">提交申请</button>
    </form>

    <footer>Powered by OpenClaw · Hosted on Huawei Server · Port 18788</footer>
  </div>

  <script>
    const form = document.getElementById('apply-form');
    const alertEl = document.getElementById('alert');
    const btn = document.getElementById('submit-btn');

    function showAlert(type, msg) {
      alertEl.className = 'alert show ' + type;
      alertEl.textContent = msg;
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertEl.className = 'alert';
      btn.disabled = true;
      btn.textContent = '提交中…';

      const fd = new FormData(form);
      const payload = {
        name: fd.get('name'),
        email: fd.get('email'),
        affiliation_type: fd.get('affiliation_type'),
        group: fd.get('group'),
        purposes: fd.getAll('purposes'),
        volume: fd.get('volume'),
        models: fd.getAll('models'),
        notes: fd.get('notes') || '',
      };

      try {
        const res = await fetch('/api/apikey-request', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data.ok) {
          showAlert('success', '✅ 申请已提交，管理员会在 1–2 个工作日内通过邮件回复。');
          form.reset();
        } else {
          showAlert('error', '❌ 提交失败：' + (data.error || ('HTTP ' + res.status)));
        }
      } catch (err) {
        showAlert('error', '❌ 网络错误：' + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = '提交申请';
      }
    });
  </script>
</body>
</html>
